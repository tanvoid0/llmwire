name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      job:
        description: 'Job to run'
        required: true
        default: 'test'
        type: choice
        options:
        - test
        - security
        - publish

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build package
      run: npm run build
    
    - name: Run tests
      run: npm test
    
    - name: Run linting
      run: npm run lint

    - name: Smoke test the built package on Node
      run: node scripts/smoke.mjs

  bun:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    - uses: oven-sh/setup-bun@v2
    - run: npm ci
    - run: npm run build
    - name: Smoke test the built package on Bun
      run: bun scripts/smoke.mjs

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run security audit
      # Zero runtime dependencies ship; audit the installed surface, not dev tooling.
      run: npm audit --omit=dev --audit-level=moderate --registry=https://registry.npmjs.org/
    
    - name: Check for secrets
      uses: trufflesecurity/trufflehog@v3.97.4
      with:
        path: ./
        base: HEAD~1

  publish:
    needs: [test, security]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: CI/CD Environment
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'publish') ||
      (github.event_name == 'release' && github.event.action == 'published')
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        registry-url: 'https://registry.npmjs.org'
        cache: 'npm'
    
    - name: Set package info
      id: pkg
      run: |
        echo "name=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).name")" >> $GITHUB_OUTPUT
        echo "version=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")" >> $GITHUB_OUTPUT
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build package
      run: npm run build
    
    - name: Run tests
      run: npm test
    
    - name: Publish to npm
      run: |
        if [ -z "$NODE_AUTH_TOKEN" ]; then
          echo "::error::NPM_TOKEN secret is not set. Add it in repo Settings → Secrets and variables → Actions (name: NPM_TOKEN, value: your npm access token)."
          exit 1
        fi
        # Idempotent: a release created after a dispatch publish must not fail on "already published".
        if npm view ${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }} version >/dev/null 2>&1; then
          echo "${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }} is already on npm; skipping"
        else
          npm publish
        fi

    - name: Publish the @tanvoid0/bot-client re-export shim
      run: |
        npm run build:shim
        if npm view @tanvoid0/bot-client@${{ steps.pkg.outputs.version }} version >/dev/null 2>&1; then
          echo "shim ${{ steps.pkg.outputs.version }} is already on npm; skipping"
        else
          npm publish ./shim
        fi
    
    - name: Create GitHub Release
      if: github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.pkg.outputs.version }}
        name: Release v${{ steps.pkg.outputs.version }}
        body: |
          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for what changed and [MIGRATION.md](https://github.com/${{ github.repository }}/blob/main/MIGRATION.md) when crossing a major.

          ### Installation
          ```bash
          npm install ${{ steps.pkg.outputs.name }}
          ```
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


